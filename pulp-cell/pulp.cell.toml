name = "bananasplit"
version = "0.1.0"
wasm = "bananasplit.wasm"

capabilities = [
    "transport.http.inbound",
    "transport.http.outbound",
]

[config]
bananagine_url = "http://localhost:3000"
# X-Service-Token sent to Bananagine on all registry calls (findReadyMatch,
# FindLobby, updateMatchStatus). Prefer the BANANAGINE_TOKEN env var so the
# secret stays out of committed config; the env var overrides this value.
# Leave empty to send unauthenticated requests (safe when Bananagine's token
# enforcement is off in the deployed environment).
bananagine_token = ""
peel_url = ""
relay_host = "hycraft.net"
relay_port = 5520
tick_rate_ms = 500
queue_timeout_sec = 300

# Shared secret gating all routes except /health (the queue, player
# registry, route-request, match-complete and referral endpoints). Auth is
# OFF unless this is set: when empty (the default) the cell starts and
# serves every route WITHOUT auth (no outage) so existing callers, which
# send no X-Service-Token, keep working. To ENABLE auth, set a non-empty
# token HERE *and* have the callers (game/lobby plugins, relay) send the
# same value as the X-Service-Token header, in lockstep. Setting only one
# side either breaks callers (token here, callers silent → 401) or does
# nothing (callers send a token the cell ignores). Prefer the SERVICE_TOKEN
# env var so the secret stays out of committed config; the env var
# overrides this value.
service_token = ""
